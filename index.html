<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>小鲸鱼 · 一直在游</title>
<style>
  :root{ --bg:#0d0c18; --panel:#181628; --panel2:#211e38; --line:#2e2a50; --fg:#f0eefb; --dim:#9a93c0; --ds:#4D6BFE; --gold:#FFC24B; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:radial-gradient(1200px 600px at 50% -10%, #1d1846 0%, var(--bg) 62%);
    color:var(--fg); font:14px/1.5 "Shantell Sans","Segoe UI",system-ui,"Microsoft YaHei",sans-serif;
    display:flex; flex-direction:column; min-height:100%;
  }
  header{padding:14px 20px 6px; display:flex; align-items:baseline; gap:14px; flex-wrap:wrap}
  header h1{margin:0; font-size:19px; letter-spacing:.5px}
  header h1 b{color:var(--ds)}
  header .sub{color:var(--dim); font-size:12.5px}
  .stagewrap{flex:1; display:flex; justify-content:center; padding:10px 20px}
  #stage{ width:min(100%,1500px); aspect-ratio:16/9; height:auto; display:block; background:#BEE7E2;
    border-radius:12px; box-shadow:0 24px 70px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.06); }
  .panel{margin:0 20px 18px; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:12px 14px; display:grid; gap:10px}
  .row{display:flex; gap:10px; align-items:center; flex-wrap:wrap}
  .row .lbl{color:var(--dim); font-size:12.5px; min-width:52px}
  button,.filebtn{ background:var(--panel2); color:var(--fg); border:1px solid var(--line);
    border-radius:9px; padding:7px 12px; font:inherit; cursor:pointer; transition:.15s; }
  button:hover,.filebtn:hover{background:#2c2a52; border-color:#464176}
  button.on{background:var(--ds); border-color:var(--ds); color:#fff}
  button.primary{background:var(--ds); border-color:var(--ds); color:#fff; font-weight:600; padding:8px 16px}
  input[type=range]{accent-color:var(--ds); height:22px}
  input[type=number]{width:78px; background:#0c0b18; color:var(--fg); border:1px solid var(--line); border-radius:8px; padding:6px 8px; font:inherit}
  #scrub{flex:1; min-width:200px}
  .time{font-variant-numeric:tabular-nums; color:var(--dim); min-width:108px; text-align:right; font-size:12.5px}
  .filebtn{position:relative; overflow:hidden; display:inline-block}
  .filebtn input{position:absolute; inset:0; opacity:0; cursor:pointer}
  .kb{color:#6f6aa0; font-size:12px}
  .sep{width:1px; height:22px; background:var(--line); margin:0 4px}
  #status{color:var(--gold); font-size:12.5px}
  .toast{position:fixed; left:50%; bottom:26px; transform:translateX(-50%); background:#282456; border:1px solid #423d80;
    padding:9px 16px; border-radius:10px; box-shadow:0 10px 40px rgba(0,0,0,.5); opacity:0; transition:.25s; pointer-events:none}
  .toast.show{opacity:1}
  body.bare header, body.bare .panel, body.bare .toast{display:none}
  body.bare .stagewrap{padding:0}
  body.bare #stage{width:100vw; height:100vh; border-radius:0; box-shadow:none}
</style>
</head>
<body>
<header>
  <h1><b>小鲸鱼</b> · 一直在游</h1>
  <span class="sub">45 秒全程序化动画 · 同一批粒子重组成 13 种形态 · 全程形变不硬切 · 纯 Canvas2D 零依赖</span>
  <span class="sep"></span>
  <span id="status">加载中…</span>
</header>

<div class="stagewrap"><canvas id="stage" width="1920" height="1080"></canvas></div>

<div class="panel">
  <div class="row">
    <button id="play" class="primary">▶ 播放</button>
    <button id="restart">⟲ 回到开头</button>
    <input id="scrub" type="range" min="0" max="45" step="0.01" value="0">
    <span class="time" id="time">0.00 / 45.00 s</span>
  </div>
  <div class="row">
    <span class="lbl">BGM</span>
    <button id="srcDemo" class="on">内置示范音轨</button>
    <label class="filebtn">载入我的 BGM…<input id="file" type="file" accept="audio/*"></label>
    <button id="srcMute">静音播放</button>
    <span class="sep"></span>
    <span class="lbl">BPM</span><input id="bpm" type="number" min="40" max="220" step="1" value="103">
    <span class="lbl">偏移</span><input id="off" type="number" min="-2" max="2" step="0.01" value="0">
    <span class="lbl">小节</span><input id="bars" type="number" min="4" max="200" step="0.01" value="19.31">
    <button id="rebuild">重新对齐</button>
  </div>
  <div class="row">
    <span class="lbl">音量</span><input id="vol" type="range" min="0" max="1" step="0.01" value="0.85" style="width:130px">
    <button id="click">节拍器</button>
    <button id="cap" class="on">字幕</button>
    <button id="grain" class="on">颗粒</button>
    <button id="vig" class="on">暗角</button>
    <span class="sep"></span>
    <button id="png">导出当前帧 PNG</button>
    <button id="sheet">联络表</button>
    <button id="rec">录制 WebM</button>
    <button id="wav">导出示范音轨 WAV</button>
  </div>
  <div class="row kb">
    空格 播放/暂停 · ← → 逐秒 · Shift+← → 五秒 · R 回到开头 · P 导出当前帧 · F 全屏 ｜ 调试：?t=15.6 静帧 · ?render=1 离线渲染 · ?rig=1 角色标准姿势
  </div>
</div>
<div class="toast" id="toast"></div>

<script>window.__errs=[];window.addEventListener('error',function(e){window.__errs.push(String((e&&e.message)||e));});</script>
<script src="js/core.js"></script>
<script src="js/char.js"></script>
<script src="js/props.js"></script>
<script src="js/odyssey.js"></script>
<script src="js/audio.js"></script>
<script src="js/main.js"></script>
</body>
</html>
